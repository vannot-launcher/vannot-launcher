name: Android Release (Paused for Independent Kotlin App)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    runs-on: ubuntu-22.04
    steps:
      - name: Explain release pause
        run: |
          echo "::error::Android releases are paused. The previous workflow branded Zalith Launcher and is not an independent Vannot Android launcher."
          echo "::error::Resume Android publishing only after the native Kotlin launcher and Minecraft runtime have been implemented and tested."
          exit 1