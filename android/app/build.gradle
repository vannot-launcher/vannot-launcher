apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "id.vannot.launcher"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "id.vannot.launcher"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100
        versionName "0.1.0-dev"
        ndk {
            abiFilters "arm64-v8a", "x86_64"
        }
    }
    sourceSets {
        main {
            assets.srcDirs = []
            jniLibs.srcDir("$buildDir/generated/jniLibs")
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.register("verifyRustCoreLibraries") {
    doLast {
        def supportedAbis = ["arm64-v8a", "x86_64"]
        def missingAbis = supportedAbis.findAll { abi ->
            !file("$buildDir/generated/jniLibs/$abi/libvannot_android_core.so").isFile()
        }
        if (!missingAbis.isEmpty()) {
            throw new GradleException(
                "Missing Rust core libraries for ${missingAbis.join(', ')}. Build them with cargo-ndk before assembling the APK."
            )
        }
    }
}

tasks.named("preBuild").configure {
    dependsOn("verifyRustCoreLibraries")
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    testImplementation "junit:junit:$junitVersion"
}
